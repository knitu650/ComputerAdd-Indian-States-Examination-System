version: '3.8'

services:
  # ==================== Databases ====================
  
  mongodb:
    image: mongo:5.0
    container_name: exam-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-exampass123}
      MONGO_INITDB_DATABASE: exam_system
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/databases/mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - exam-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  postgresql:
    image: postgres:14
    container_name: exam-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exampass123}
      POSTGRES_DB: exam_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./backend/databases/postgresql/init:/docker-entrypoint-initdb.d
    networks:
      - exam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine
    container_name: exam-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-exampass123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Message Queue ====================
  
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: exam-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-exampass123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - exam-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== Backend Services ====================
  
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: exam-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-exampass123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    networks:
      - exam-network
    volumes:
      - ./backend/api-gateway/logs:/app/logs

  user-service:
    build:
      context: ./backend/microservices/user-service
      dockerfile: Dockerfile
    container_name: exam-user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-exampass123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-exampass123}@rabbitmq:5672
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    networks:
      - exam-network
    volumes:
      - ./backend/microservices/user-service/logs:/app/logs

  examination-service:
    build:
      context: ./backend/microservices/examination-service
      dockerfile: Dockerfile
    container_name: exam-examination-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-exampass123}@redis:6379
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-exampass123}@rabbitmq:5672
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    networks:
      - exam-network
    volumes:
      - ./backend/microservices/examination-service/logs:/app/logs

  ai-ml-service:
    build:
      context: ./backend/microservices/ai-ml-service
      dockerfile: Dockerfile
    container_name: exam-ai-ml-service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 5000
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-exampass123}@redis:6379
      GPU_ENABLED: ${GPU_ENABLED:-false}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    networks:
      - exam-network
    volumes:
      - ./ai-ml/data:/app/data
      - ./ai-ml/computer-vision/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  proctoring-service:
    build:
      context: ./backend/microservices/proctoring-service
      dockerfile: Dockerfile
    container_name: exam-proctoring-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-exampass123}@redis:6379
      AI_ML_SERVICE_URL: http://ai-ml-service:5000
    ports:
      - "3003:3003"
    depends_on:
      - mongodb
      - redis
      - ai-ml-service
    networks:
      - exam-network

  analytics-service:
    build:
      context: ./backend/microservices/analytics-service
      dockerfile: Dockerfile
    container_name: exam-analytics-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      POSTGRES_URI: postgresql://examuser:${POSTGRES_PASSWORD:-exampass123}@postgresql:5432/exam_analytics
      REDIS_URL: redis://:${REDIS_PASSWORD:-exampass123}@redis:6379
    ports:
      - "3004:3004"
    depends_on:
      - mongodb
      - postgresql
      - redis
    networks:
      - exam-network

  notification-service:
    build:
      context: ./backend/microservices/notification-service
      dockerfile: Dockerfile
    container_name: exam-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-exampass123}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "3005:3005"
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - exam-network

  payment-service:
    build:
      context: ./backend/microservices/payment-service
      dockerfile: Dockerfile
    container_name: exam-payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-exampass123}@mongodb:27017/exam_system?authSource=admin
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    ports:
      - "3006:3006"
    depends_on:
      - mongodb
    networks:
      - exam-network

  # ==================== Frontend ====================
  
  web-app:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: exam-web-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - exam-network

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: exam-admin-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
    networks:
      - exam-network

  # ==================== Monitoring ====================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: exam-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./devops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - exam-network

  grafana:
    image: grafana/grafana:latest
    container_name: exam-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./devops/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - exam-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.0
    container_name: exam-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - exam-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.7.0
    container_name: exam-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - exam-network

networks:
  exam-network:
    driver: bridge

volumes:
  mongodb_data:
  postgresql_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
