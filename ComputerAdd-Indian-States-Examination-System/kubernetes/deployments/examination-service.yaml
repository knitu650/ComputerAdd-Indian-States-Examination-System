apiVersion: apps/v1
kind: Deployment
metadata:
  name: examination-service
  labels:
    app: examination-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examination-service
  template:
    metadata:
      labels:
        app: examination-service
    spec:
      containers:
      - name: examination-service
        image: your-docker-registry/examination-service:latest
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: exam-db-url