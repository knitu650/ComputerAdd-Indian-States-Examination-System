apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ml-service
  labels:
    app: ai-ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-ml-service
  template:
    metadata:
      labels:
        app: ai-ml-service
    spec:
      containers:
      - name: ai-ml-service
        image: your-docker-registry/ai-ml-service:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ai-db-url
        - name: MODEL_STORAGE_PATH
          value: "/models"
        volumeMounts:
        - name: model-storage
          mountPath: /models
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ai-model-pvc