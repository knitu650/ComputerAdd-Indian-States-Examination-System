name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd backend/api-gateway
          npm ci
          
      - name: Run tests
        run: |
          cd backend/api-gateway
          npm test
          
      - name: Run lint
        run: |
          cd backend/api-gateway
          npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd frontend/web-app
          npm ci
          
      - name: Run tests
        run: |
          cd frontend/web-app
          npm test
          
      - name: Build
        run: |
          cd frontend/web-app
          npm run build

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push API Gateway
        uses: docker/build-push-action@v4
        with:
          context: ./backend/api-gateway
          push: true
          tags: exam-system/api-gateway:latest
          
      - name: Build and push User Service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/microservices/user-service
          push: true
          tags: exam-system/user-service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
          
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/namespaces/production.yaml
          kubectl apply -f kubernetes/deployments/
          kubectl apply -f kubernetes/services/
          kubectl rollout status deployment/api-gateway -n exam-system
