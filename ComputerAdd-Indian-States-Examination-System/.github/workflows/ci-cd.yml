name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install Dependencies & Run Tests - API Gateway
      working-directory: ./backend/api-gateway
      run: |
        npm install
        npm test

    - name: Install Dependencies & Run Tests - User Service
      working-directory: ./backend/microservices/user-service
      run: |
        npm install
        npm test

    - name: Install Dependencies & Run Tests - Examination Service
      working-directory: ./backend/microservices/examination-service
      run: |
        npm install
        npm test

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install Dependencies & Run Tests - AI/ML Service
      working-directory: ./backend/microservices/ai-ml-service
      run: |
        pip install -r requirements.txt
        # Add test command here, e.g., pytest

  build-and-push-docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push API Gateway
      uses: docker/build-push-action@v2
      with:
        context: ./backend/api-gateway
        push: true
        tags: your-docker-registry/api-gateway:latest

    - name: Build and push User Service
      uses: docker/build-push-action@v2
      with:
        context: ./backend/microservices/user-service
        push: true
        tags: your-docker-registry/user-service:latest

    - name: Build and push Examination Service
      uses: docker/build-push-action@v2
      with:
        context: ./backend/microservices/examination-service
        push: true
        tags: your-docker-registry/examination-service:latest

    - name: Build and push AI/ML Service
      uses: docker/build-push-action@v2
      with:
        context: ./backend/microservices/ai-ml-service
        push: true
        tags: your-docker-registry/ai-ml-service:latest

  deploy-to-kubernetes:
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Kubeconfig
      uses: azure/k8s-set-context@v1
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f kubernetes/deployments/
        kubectl apply -f kubernetes/services/
        # Add other kubectl apply commands as needed