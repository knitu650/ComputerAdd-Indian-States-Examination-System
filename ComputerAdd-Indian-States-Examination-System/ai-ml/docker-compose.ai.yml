version: '3.8'

services:
  ai-ml-service:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: ai-ml-service
    ports:
      - "5000:5000"
      - "8888:8888"  # Jupyter for experiments
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./experiments:/app/experiments
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ai-network

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: jupyter-lab
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    ports:
      - "8888:8888"
    volumes:
      - ./experiments/notebooks:/app/notebooks
      - ./data:/app/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - ai-network

  mlflow:
    image: python:3.10-slim
    container_name: mlflow-server
    command: >
      sh -c "pip install mlflow && 
             mlflow server 
             --backend-store-uri sqlite:///mlflow.db 
             --default-artifact-root ./mlruns 
             --host 0.0.0.0 
             --port 5001"
    ports:
      - "5001:5001"
    volumes:
      - ./mlflow:/mlflow
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge
