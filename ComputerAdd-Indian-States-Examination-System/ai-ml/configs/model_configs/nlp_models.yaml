# NLP Models Configuration

question_generation:
  model_type: t5
  model_name: t5-base
  max_input_length: 512
  max_output_length: 128
  
  generation_params:
    num_beams: 5
    temperature: 0.8
    top_k: 50
    top_p: 0.95
    do_sample: true
    num_return_sequences: 3
  
  training:
    optimizer: adamw
    learning_rate: 0.0001
    warmup_steps: 500
    weight_decay: 0.01
    batch_size: 4
    epochs: 10

answer_evaluation:
  model_type: sentence_transformer
  model_name: all-MiniLM-L6-v2
  max_length: 512
  
  similarity_thresholds:
    correct: 0.9
    partially_correct: 0.7
    needs_improvement: 0.5
  
  training:
    optimizer: adam
    learning_rate: 0.00002
    batch_size: 16
    epochs: 5

multilingual_support:
  languages:
    - en
    - hi
    - ta
    - te
    - kn
    - ml
  
  model_type: mbert
  model_name: bert-base-multilingual-cased
  
  translation:
    model: m2m100
    max_length: 512
