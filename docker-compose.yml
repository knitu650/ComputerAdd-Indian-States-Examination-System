version: '3.8'

services:
  # Backend Services
  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend/api-gateway:/app

  user-service:
    build: ./backend/microservices/user-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/user-db
    depends_on:
      - mongodb

  examination-service:
    build: ./backend/microservices/examination-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/exam-db
    depends_on:
      - mongodb

  ai-ml-service:
    build:
      context: ./backend/microservices/ai-ml-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend/microservices/ai-ml-service:/app

  # Frontend Services
  web-app:
    build: ./frontend/web-app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/web-app/src:/app/src

  admin-dashboard:
    build: ./frontend/admin-dashboard
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/admin-dashboard/src:/app/src

  # Databases
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  postgresql:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=main_db
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

volumes:
  mongodb-data:
  postgresql-data: